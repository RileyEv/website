<div class="column-item">
  <article class="recipe-card">
    $if(image)$
      <a href="$url$">
        <div class="media-wrapper">
          <img src="$image$" alt="$title$">
        </div>
      </a>
    $endif$
    <div class="text-caption">
      <a href="$url$">
        <h3>$title$</h3>
      </a>

      <hr/>
      <p>$if(description)$$description$$endif$</p>
    </div>
    <div style="clear:both"></div>
  </article>
</div>
